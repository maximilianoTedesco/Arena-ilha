<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agendamento | Grupo Rodrigo Ilha</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body id="bookingBody">
  <main class="booking-page">
    <div class="booking-carousel" id="bookingCarousel"></div>
    <div class="booking-overlay"></div>
  
    <section class="booking-card">
      <a href="arenas.html" class="back-link top-back">← Trocar arena</a>

      <div class="booking-header">
  <img id="arenaLogo" src="" alt="Logo da arena" class="booking-logo" />
  <span class="booking-label">Agendamento de futsal</span>
  <h1 id="arenaTitle">Arena</h1>
  <p>Escolha o dia, horário e preencha seus dados para confirmar.</p>
  <div class="arena-gallery">
  <div class="arena-gallery-track" id="arenaGalleryTrack"></div>
</div>
        
</div>

<form id="bookingForm" class="booking-form">

  <section class="schedule-panel">
    <div class="schedule-panel-header">
      <span>Escolha seu horário</span>
      <small>Arraste para o lado ou aguarde</small>
    </div>

    <label>
      Data
      <input type="date" id="data" required />
    </label>

    <div>
      <span class="field-title">Horários disponíveis</span>
      <div id="timeGrid" class="time-grid"></div>
    </div>
  </section>

  <label>
    Nome completo
    <input type="text" id="nome" placeholder="Seu nome" required />
  </label>

  <label>
    WhatsApp
    <input type="tel" id="whatsapp" placeholder="51999999999" required />
  </label>

  <label>
    Observação
    <textarea id="observacao" rows="3" placeholder="Ex: jogo entre amigos, mensalista, etc."></textarea>
  </label>

  <button type="submit" class="btn booking-btn">Confirmar agendamento</button>

  <a
  class="churrasqueira-card"
  target="_blank"
  href="https://wa.me/5551995766825?text=Olá!%20Gostaria%20de%20consultar%20os%20horários%20disponíveis%20para%20reservar%20a%20churrasqueira."
>
  <div class="churrasqueira-icon">🔥</div>

  <div class="churrasqueira-info">
    <strong>Reservar churrasqueira</strong>
    <span>Consulte horários disponíveis pelo WhatsApp</span>
  </div>

  <div class="churrasqueira-arrow">→</div>
</a>
</form>

      <div id="successBox" class="success-box hidden">
        <h2>Horário selecionado!</h2>
        <p id="successText"></p>
        <a id="whatsLink" class="btn whatsapp-btn" target="_blank">Enviar pelo WhatsApp</a>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="script.js"></script>
  <script src="script.js"></script>
</body>
</html>
