<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADM | Arena Ilha</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">

  <main class="admin-container">
    <section id="loginBox" class="admin-card">
      <h1>Painel ADM</h1>

      <input id="password" type="password" placeholder="Senha do administrador" />

      <button id="loginBtn">Entrar</button>
      <p id="loginMessage"></p>
    </section>

    <section id="adminPanel" class="admin-panel hidden">
      <div class="admin-header">
        <h1>Controle de Horários</h1>
        <button id="logoutBtn">Sair</button>
      </div>

      <div class="admin-grid">
        <section class="admin-card">
          <h2>Horários por Arena</h2>

          <select id="arenaSelect">
            <option value="intersul">Arena Intersul</option>
            <option value="alvorada">Arena Alvorada</option>
          </select>

          <select id="diaSemana">
            <option value="1">Segunda</option>
            <option value="2">Terça</option>
            <option value="3">Quarta</option>
            <option value="4">Quinta</option>
            <option value="5">Sexta</option>
            <option value="6">Sábado</option>
            <option value="0">Domingo</option>
          </select>

          <input id="horaInicio" type="time" />
          <input id="horaFim" type="time" />

          <button id="salvarHorarioBtn">Salvar horário</button>

          <div id="horariosList"></div>
        </section>

        <section class="admin-card">
          <h2>Promoções por horário</h2>

          <label>Arena</label>
          <select id="promoArena">
            <option value="intersul">Arena Intersul</option>
            <option value="alvorada">Arena Alvorada</option>
          </select>

          <label>Data</label>
          <input id="promoData" type="date" />

          <button id="buscarHorariosPromoBtn">Buscar horários</button>

          <div id="promoLegenda" class="promo-legenda">
            <span><b class="legenda-verde"></b> Livre</span>
            <span><b class="legenda-vermelho"></b> Ocupado/Bloqueado</span>
            <span><b class="legenda-amarelo"></b> Com promoção</span>
          </div>

          <div id="promoHorariosList" class="promo-horarios-list"></div>

          <div id="promoFormBox" class="promo-form-box hidden">
            <h3 id="promoHorarioSelecionado">Horário selecionado</h3>

            <input id="promoValorNormal" type="number" placeholder="Valor normal" />
            <input id="promoValorPromocional" type="number" placeholder="Valor promocional" />
            <input id="promoDescricao" type="text" placeholder="Ex: Condição especial hoje" />

            <button id="salvarPromoSelecionadaBtn">Salvar promoção</button>
          </div>

          <div id="descontosList"></div>
        </section>

        <section class="admin-card">
          <h2>Bloquear Horário</h2>

          <select id="bloqueioArena">
            <option value="intersul">Arena Intersul</option>
            <option value="alvorada">Arena Alvorada</option>
          </select>

          <input id="bloqueioData" type="date" />
          <input id="bloqueioHorario" type="time" />
          <input id="motivoBloqueio" type="text" placeholder="Motivo" />

          <button id="salvarBloqueioBtn">Bloquear</button>

          <div id="bloqueiosList"></div>
        </section>

        <section class="admin-card">
          <h2>Agendamentos</h2>
          <div id="agendamentosList"></div>
        </section>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
