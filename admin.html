<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADM | Arena Ilha</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="admin-body">

  <main class="admin-container">
    <section id="loginBox" class="admin-card">
      <h1>Painel ADM</h1>
      <input id="password" type="password" placeholder="Senha do administrador" />
      <button id="loginBtn">Entrar</button>
      <p id="loginMessage"></p>
    </section>

    <section id="adminPanel" class="admin-panel hidden">
      <div class="admin-header">
        <h1>Agenda ADM</h1>
        <button id="logoutBtn">Sair</button>
      </div>

      <section class="admin-card">
        <h2>Selecione a arena e o dia</h2>

        <label>Arena</label>
        <select id="adminArena">
          <option value="">Selecione uma arena</option>
          <option value="intersul">Arena Intersul</option>
          <option value="alvorada">Arena Alvorada</option>
        </select>

        <label>Data</label>
        <input id="adminData" type="date" />

        <button id="buscarAgendaBtn">Buscar horários</button>

        <div class="agenda-legenda">
          <span><b class="legenda-verde"></b> Livre</span>
          <span><b class="legenda-vermelho"></b> Ocupado/Bloqueado</span>
          <span><b class="legenda-amarelo"></b> Promoção</span>
        </div>

        <div id="agendaHorariosList" class="agenda-horarios-list"></div>
      </section>

      <section id="acoesHorarioBox" class="admin-card hidden">
        <h2 id="horarioSelecionadoTitulo">Horário selecionado</h2>

        <div class="acao-botoes">
          <button id="abrirReservaBtn">Reservar</button>
          <button id="abrirPromocaoBtn">Promoção</button>
          <button id="desmarcarHorarioBtn" class="danger-btn">Desmarcar</button>
        </div>

        <div id="reservaBox" class="acao-form hidden">
          <h3>Reservar horário</h3>
          <input id="reservaNome" type="text" placeholder="Nome do cliente" />
          <input id="reservaWhatsapp" type="text" placeholder="WhatsApp do cliente" />
          <input id="reservaObservacao" type="text" placeholder="Observação" />
          <button id="salvarReservaBtn">Salvar reserva</button>
        </div>

        <div id="promocaoBox" class="acao-form hidden">
          <h3>Criar promoção</h3>
          <input id="promoValorNormal" type="number" placeholder="Valor normal" />
          <input id="promoValorPromocional" type="number" placeholder="Valor promocional" />
          <input id="promoDescricao" type="text" placeholder="Ex: Condição especial hoje" />
          <button id="salvarPromocaoBtn">Salvar promoção</button>
        </div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
